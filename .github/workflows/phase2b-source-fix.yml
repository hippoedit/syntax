name: Phase 2B Source Fix

on:
  push:
    branches:
      - phase2b-source-reconciliation
    paths:
      - .github/workflows/phase2b-source-fix.yml

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2b-source-reconciliation
          fetch-depth: 0

      - name: Repair malformed 1C syntax XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('1C/1c_spec.xml')
          data = path.read_text(encoding='utf-8-sig')
          replacements = [
              (
                  '<Style id="constant_Date" name="Константа Дата" bold="1"\n\t\t\t\t\tbold="0"',
                  '<Style id="constant_Date" name="Константа Дата"\n\t\t\t\t\tbold="0"',
              ),
              (
                  '<Scope open="Для каждого" close="КонецЦикла"strict="true">',
                  '<Scope open="Для каждого" close="КонецЦикла" strict="true">',
              ),
          ]
          for old, new in replacements:
              if old not in data:
                  raise SystemExit(f'expected malformed sequence not found: {old}')
              data = data.replace(old, new, 1)
          path.write_text(data, encoding='utf-8')
          PY

      - name: Validate corrected XML
        run: php -r '$x=simplexml_load_file("1C/1c_spec.xml"); if ($x === false) exit(1);'

      - name: Commit correction
        run: |
          git config user.name "HippoEDIT"
          git config user.email "hippoedit@users.noreply.github.com"
          git add 1C/1c_spec.xml
          git commit -m "fix: repair malformed 1C syntax XML"
          git push origin HEAD:phase2b-source-reconciliation
