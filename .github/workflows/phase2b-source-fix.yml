name: Phase 2B Source Bitmap Reconciliation

on:
  push:
    branches:
      - phase2b-source-reconciliation
    paths:
      - .github/workflows/phase2b-source-fix.yml

permissions:
  contents: write

jobs:
  reconcile-css-bitmap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2b-source-reconciliation
          fetch-depth: 0

      - name: Restore CSS bitmap from canonical shared payload
        run: |
          test ! -e CSS/images/vs_styles.bmp
          test -f C++/images/vs_styles.bmp
          grep -Fq '<StyleBitmap>images\vs_styles.bmp</StyleBitmap>' CSS/css_ms_spec.xml
          mkdir -p CSS/images
          cp C++/images/vs_styles.bmp CSS/images/vs_styles.bmp
          test "$(sha256sum C++/images/vs_styles.bmp | cut -d' ' -f1)" = "$(sha256sum CSS/images/vs_styles.bmp | cut -d' ' -f1)"

      - name: Validate all bitmap references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          missing = []
          count = 0
          for path in sorted(root.rglob('*_spec.xml')):
              tree = ET.parse(path)
              for tag in ('StyleBitmap', 'MarginBitmap'):
                  for node in tree.findall(f'.//SPECIFICATION/{tag}'):
                      declared = (node.text or '').strip().replace('\\', '/')
                      source = path.parent / declared
                      count += 1
                      if not source.is_file():
                          missing.append(f'{path.as_posix()}: {declared}')
          print('BITMAP REFERENCES:', count)
          print('MISSING BITMAP REFERENCES:', len(missing))
          for item in missing:
              print('  ', item)
          if missing:
              raise SystemExit(1)
          PY

      - name: Commit CSS bitmap source
        run: |
          git config user.name "HippoEDIT"
          git config user.email "hippoedit@users.noreply.github.com"
          git add CSS/images/vs_styles.bmp
          git diff --cached --check
          git commit -m "fix: restore CSS syntax bitmap payload"
          git push origin HEAD:phase2b-source-reconciliation
